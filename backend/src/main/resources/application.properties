spring.application.name=po-approval-system

# Database Configuration
# Defaults to persistent local database so the application works out-of-the-box.
# Can be overridden via DB_URL environment variable to point to Supabase PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./database/po_db;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Custom Secret configuration
jwt.secret=${JWT_SECRET:30m5IRsJcGdHv6gsPNB9YGn/k+EpUUA8TE8BFG6D9J7CkmjTRNxTcmvcugQXE1eph/6XiJBwqZrfX97gcc+X4g==}

# Server port configuration (supports Render dynamic PORT env variable with fallback to 8082)
server.port=${PORT:8082}
