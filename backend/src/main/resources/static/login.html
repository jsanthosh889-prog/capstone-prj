<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PO Flow</title>
    <meta name="description" content="Secure login portal for Purchase Order Approval Workflow System">
    
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Global and Component CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card-wrapper">
        <div class="auth-card">
            
            <!-- Brand & Heading -->
            <div class="auth-brand">
                <div class="brand-icon-wrapper">
                    <span>📋</span>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your PO Flow enterprise account</p>
            </div>

            <!-- Existing Session Banner (shown only if already logged in) -->
            <div id="already-logged-in-banner" class="auth-alert auth-alert-success" style="display: none; justify-content: space-between; align-items: center;">
                <div>
                    <span style="font-weight: 600;">Active Session:</span> <span id="current-user-name"></span>
                </div>
                <div style="display: flex; gap: 0.75rem; align-items: center;">
                    <a href="dashboard.html" style="color: inherit; font-weight: 700; text-decoration: underline;">Dashboard &rarr;</a>
                    <button type="button" id="switch-account-btn" style="background: none; border: none; color: inherit; font-size: 0.8rem; text-decoration: underline; cursor: pointer; padding: 0;">Sign Out</button>
                </div>
            </div>

            <!-- Dynamic Error Alert -->
            <div id="error-message" class="auth-alert auth-alert-error" role="alert">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-text" style="flex: 1;">Invalid credentials</span>
            </div>

            <!-- Dynamic Success Alert -->
            <div id="success-message" class="auth-alert auth-alert-success" role="alert">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span id="success-text" style="flex: 1;">Login successful! Redirecting...</span>
            </div>

            <!-- Main Login Form -->
            <form id="login-form" novalidate>
                
                <!-- Email Field -->
                <div class="form-group">
                    <label class="form-label" for="email">
                        <span>Email Address</span>
                    </label>
                    <div class="input-container">
                        <div class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            class="form-input" 
                            placeholder="name@company.com" 
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <div class="form-label">
                        <label for="password">Password</label>
                    </div>
                    <div class="input-container">
                        <div class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            class="form-input" 
                            placeholder="••••••••" 
                            autocomplete="current-password"
                            required
                        >
                        <button 
                            type="button" 
                            id="toggle-password" 
                            class="password-toggle" 
                            aria-label="Toggle password visibility"
                            title="Show password"
                        >
                            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="btn-submit">
                    <span id="btn-spinner" class="spinner" style="display: none;"></span>
                    <span id="btn-text">Sign In</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Quick Demo Accounts -->
            <div class="demo-section">
                <div class="demo-title">
                    <span>⚡ Quick Demo Sign-In</span>
                </div>
                <div class="demo-grid">
                    <button type="button" class="demo-btn" data-email="alice@example.com" data-role="REQUESTER" title="Click to fill Requester account">
                        <span class="demo-role-icon">👤</span>
                        <span class="demo-role-name">Requester</span>
                        <span class="demo-role-sub">Alice</span>
                    </button>
                    <button type="button" class="demo-btn" data-email="bob@example.com" data-role="APPROVER" title="Click to fill Approver account">
                        <span class="demo-role-icon">🛡️</span>
                        <span class="demo-role-name">Approver</span>
                        <span class="demo-role-sub">Bob</span>
                    </button>
                    <button type="button" class="demo-btn" data-email="charlie@example.com" data-role="ADMIN" title="Click to fill Admin account">
                        <span class="demo-role-icon">⚙️</span>
                        <span class="demo-role-name">Admin</span>
                        <span class="demo-role-sub">Charlie</span>
                    </button>
                </div>
            </div>

            <!-- Footer Links -->
            <div class="auth-links">
                Don't have an account? <a href="register.html" class="auth-link">Create an account</a>
            </div>

        </div>
    </div>

    <!-- Auth Logic Script -->
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const eyeIcon = document.getElementById('eye-icon');
            const submitBtn = document.getElementById('submit-btn');
            const btnSpinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');
            const errorAlert = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const successAlert = document.getElementById('success-message');
            const successText = document.getElementById('success-text');
            const demoButtons = document.querySelectorAll('.demo-btn');
            const alreadyLoggedInBanner = document.getElementById('already-logged-in-banner');
            const currentUserName = document.getElementById('current-user-name');
            const switchAccountBtn = document.getElementById('switch-account-btn');

            // Check if user is already logged in
            const currentUser = getLoggedInUser();
            const token = getAuthToken();
            if (currentUser && token) {
                alreadyLoggedInBanner.style.display = 'flex';
                currentUserName.innerText = `${currentUser.name} (${currentUser.role})`;
            }

            if (switchAccountBtn) {
                switchAccountBtn.addEventListener('click', () => {
                    clearAuthSession();
                    alreadyLoggedInBanner.style.display = 'none';
                });
            }

            // Password Show/Hide Toggle
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                togglePasswordBtn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
                
                if (isPassword) {
                    // Eye slash icon
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                } else {
                    // Regular eye icon
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                }
            });

            // Quick Demo Account Buttons
            demoButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    demoButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const email = btn.getAttribute('data-email');
                    emailInput.value = email;
                    passwordInput.value = 'password123';
                    
                    hideAlerts();
                    emailInput.focus();
                });
            });

            function hideAlerts() {
                errorAlert.classList.remove('visible');
                successAlert.classList.remove('visible');
            }

            function showError(msg) {
                hideAlerts();
                errorText.innerText = msg;
                errorAlert.classList.add('visible');
                // Re-trigger shake animation
                errorAlert.style.animation = 'none';
                errorAlert.offsetHeight; /* trigger reflow */
                errorAlert.style.animation = null;
            }

            function showSuccess(msg) {
                hideAlerts();
                successText.innerText = msg;
                successAlert.classList.add('visible');
            }

            function setLoading(loading) {
                if (loading) {
                    submitBtn.disabled = true;
                    btnSpinner.style.display = 'inline-block';
                    btnText.innerText = 'Signing In...';
                } else {
                    submitBtn.disabled = false;
                    btnSpinner.style.display = 'none';
                    btnText.innerText = 'Sign In';
                }
            }

            // Handle Form Submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlerts();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email) {
                    showError('Please enter your email address.');
                    emailInput.focus();
                    return;
                }

                if (!password) {
                    showError('Please enter your password.');
                    passwordInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const data = await loginUser(email, password);
                    showSuccess(`Welcome back, ${data.name || 'User'}! Redirecting to dashboard...`);
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                } catch (err) {
                    setLoading(false);
                    showError(err.message || 'Authentication failed. Please check your credentials.');
                }
            });
        });
    </script>
</body>
</html>
