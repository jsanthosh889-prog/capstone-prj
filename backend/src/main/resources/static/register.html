<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — PO Flow</title>
    <meta name="description" content="Register for Purchase Order Approval Workflow System">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.2em;
            padding-right: 2.5rem;
            cursor: pointer;
        }
        .form-select option {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-card-wrapper">
        <div class="auth-card">
            
            <!-- Brand & Heading -->
            <div class="auth-brand">
                <div class="brand-icon-wrapper">
                    <span>📝</span>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join the PO Flow Approval Network</p>
            </div>

            <!-- Dynamic Error & Success Alerts -->
            <div id="error-message" class="auth-alert auth-alert-error" role="alert">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-text" style="flex: 1;">Registration error</span>
            </div>

            <div id="success-message" class="auth-alert auth-alert-success" role="alert">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span id="success-text" style="flex: 1;">Registration successful! Redirecting to login...</span>
            </div>

            <!-- Main Register Form -->
            <form id="register-form" novalidate>
                
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <div class="input-container">
                        <div class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <input type="text" id="name" class="form-input" placeholder="Alex Morgan" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-container">
                        <div class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                        <input type="email" id="email" class="form-input" placeholder="alex@company.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-container">
                        <div class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">System Role</label>
                    <div class="input-container">
                        <div class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                        </div>
                        <select id="role" class="form-input form-select" required>
                            <option value="" disabled selected>Select system role</option>
                            <option value="REQUESTER">Requester — Create &amp; track purchase orders</option>
                            <option value="APPROVER">Approver — Review &amp; approve orders</option>
                            <option value="ADMIN">Admin — Full oversight &amp; configuration</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    <span id="btn-spinner" class="spinner" style="display: none;"></span>
                    <span id="btn-text">Register Account</span>
                </button>
            </form>

            <div class="auth-links">
                Already have an account? <a href="login.html" class="auth-link">Sign In here</a>
            </div>

        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            const errorAlert = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const successAlert = document.getElementById('success-message');
            const successText = document.getElementById('success-text');
            const submitBtn = document.getElementById('submit-btn');
            const btnSpinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');

            errorAlert.classList.remove('visible');
            successAlert.classList.remove('visible');

            if (!name || !email || !password || !role) {
                errorText.innerText = 'Please complete all fields.';
                errorAlert.classList.add('visible');
                return;
            }

            submitBtn.disabled = true;
            btnSpinner.style.display = 'inline-block';
            btnText.innerText = 'Registering...';

            try {
                await registerUser(name, email, password, role);
                successText.innerText = 'Registration successful! Redirecting to login...';
                successAlert.classList.add('visible');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (err) {
                submitBtn.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.innerText = 'Register Account';
                errorText.innerText = err.message || 'Registration failed.';
                errorAlert.classList.add('visible');
            }
        });
    </script>
</body>
</html>
